<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0e27">
  <title>Error | CafBarDLA</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center;
      justify-content:center; background:#0a0e27; color:#fef3c7;
      font-family:system-ui,-apple-system,sans-serif; text-align:center; padding:24px; }
    .card { max-width:440px; }
    .code { font-size:64px; font-weight:800; color:#d4af37; margin:0; }
    h1 { font-size:22px; margin:8px 0; }
    p { font-size:15px; line-height:1.5; opacity:.85; }
    a { margin-top:20px; display:inline-block; padding:12px 24px; border-radius:999px;
      background:#d4af37; color:#0a0e27; font-weight:700; text-decoration:none; }
    .ref { margin-top:16px; font-size:12px; opacity:.5; }
  </style>
</head>
<body>
  <div class="card">
    <p class="code">{{ codigo }}</p>
    <h1>{{ titulo }}</h1>
    <p>{{ mensaje }}</p>
    <a href="/dashboard">Volver al inicio</a>
    {% if referencia %}<p class="ref">Referencia: {{ referencia }}</p>{% endif %}
  </div>
</body>
</html>
