# Configuracion de Nginx para servir CafBarDLA con HTTPS.
#
# A diferencia de Caddy, con Nginx el certificado se obtiene aparte (certbot):
#   sudo certbot --nginx -d pos.tunegocio.com
# certbot edita este archivo para agregar las lineas ssl_certificate.
#
# Requisitos:
#   1. Dominio apuntando al servidor.
#   2. CafBarDLA corriendo en el puerto 8000.
#   3. certbot instalado (paquete python3-certbot-nginx).

# Redirige HTTP a HTTPS.
server {
    listen 80;
    server_name pos.tunegocio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pos.tunegocio.com;

    # certbot completa estas dos lineas automaticamente:
    # ssl_certificate     /etc/letsencrypt/live/pos.tunegocio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/pos.tunegocio.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # IP real del cliente (para rate limit y auditoria).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
